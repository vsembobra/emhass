name: "Solar Reserve — Солнечный резерв"
description: >-
  План батареи на 48 ч на EMHASS: квантильные прогнозы нагрузки и солнца по
  данным Recorder, резерв на время серии отключений и MILP-оптимизатор
  (CVXPY/HiGHS) — плавающий пол SOC, цели зон TOU и ночной заряд по дешёвому
  тарифу ровно под то, что нужно до следующей ночи в выбранном сценарии
  (оптимистичный, средний или пессимистичный день). Аддон учится на данных
  объекта: поправляет прогнозы, переобучает модели, только если новая не
  хуже, определяет ёмкость батареи и ориентацию панелей. По умолчанию
  только советует; с «Применять план к инвертору» пишет цели в инвертор.

version: "0.20.0"
slug: emhass_shadow
init: false
arch:
  - amd64
  - aarch64
startup: application
boot: auto
hassio_api: true
homeassistant_api: true
map:
  - share:rw
ingress: true
ingress_port: 8099
panel_admin: false
panel_icon: mdi:battery-sync-outline
panel_title: Solar Reserve
options:
  apply_mode: false
  notifications: true
  publish_sensors: false
  min_soc_pct: 10.0
  tariff_enabled: false
  tariff_normal_price: 2.0
  tariff_cheap_price: 1.0
  tariff_cheap_windows: "23:00-07:00"
  priority_mode: balanced
  autotune: false
  panel_kwp: 7.0
  open_meteo_model: auto
  deferrable_loads: []
schema:
  apply_mode: bool
  notifications: bool
  publish_sensors: bool
  min_soc_pct: float(0,50)
  tariff_enabled: bool
  tariff_normal_price: float(0,1000)
  tariff_cheap_price: float(0,1000)
  tariff_cheap_windows: str
  priority_mode: list(resilience|balanced|economy)
  autotune: bool
  panel_kwp: float(0.5,100)
  open_meteo_model: list(auto|ecmwf|icon|gfs)
  deferrable_loads:
    - name: str
      power_kw: float(0.1,30)
      hours: float(0.5,12)
      window: str?
  latitude: float(-90,90)?
  longitude: float(-180,180)?
  time_zone: str?
  capacity_kwh: float(1,200)?
  panel_tilt_deg: float(0,90)?
  panel_azimuth_deg: float(0,360)?
  max_soc_pct: float(50,100)?
  discharge_efficiency: float(0.5,1)?
  charge_efficiency: float(0.5,1)?
  max_charge_kw: float(0.5,50)?
  max_discharge_kw: float(0.5,50)?
  floor_input_entity: str?
  entity_load_power: str?
  entity_critical_load_power: str?
  entity_pv_power: str?
  entity_battery_power: str?
  entity_grid_power: str?
  entity_battery_soc: str?
  entity_outdoor_temperature: str?
  entity_grid_status: str?
  entity_grid_voltage: str?
  entity_export_counter: str?
  tou_soc_entity_template: str?
  tou_time_entity_template: str?
  run_time: match(^([01]\d|2[0-3]):[0-5]\d$)?
  retrain_enabled: bool?
  retrain_interval_days: int(1,30)?
  optimizer_enabled: bool?
  day_zone_strategy: list(ladder|flat)?
  reserve_cold_start_hours: float(0,20)?
  reserve_pv_aware: bool?
  history_backfill_days: int(0,60)?
  entity_battery_soh: str?
  load_holidays: str?
  tou_zones: int(1,12)?
  tou_soc_step_pct: int(1,10)?
  tou_grid_charge_entity_template: str?
  outage_memory_days: int(3,60)?
  history_statistics_days: int(0,730)?
  replan_minutes: int(15,240)?
  tou_grid_charge_on_option: str?
  tou_grid_charge_off_option: str?
  calibration_charge_enabled: bool?
  calibration_interval_days: int(3,60)?
translations:
  ru:
    configuration:
      open_meteo_model:
        name: Погодная модель Open-Meteo
        description: Auto — автоматический подбор; ECMWF — IFS HRES; ICON и GFS — Seamless. История и обучение каждой модели хранятся отдельно.
      latitude:
        name: Широта
        description: Координата объекта, например 44.94892. Нужна для расчёта высоты солнца и погоды. Можно заполнить кнопкой «Автоматический поиск» или вручную.
      longitude:
        name: Долгота
        description: Координата объекта, например 34.10887. Можно заполнить кнопкой «Автоматический поиск» или вручную.
      time_zone:
        name: Часовой пояс
        description: Имя из базы IANA, например Europe/Istanbul. Все окна и зоны считаются по местному времени. Можно заполнить кнопкой «Автоматический поиск» или вручную.
      capacity_kwh:
        name: Ёмкость батареи, кВт·ч
        description: "Полная номинальная ёмкость АКБ. Например 32 для 32 кВт·ч. Кнопка «Автоматический поиск» предлагает значение из настроек инвертора — Battery Capacity (А·ч) × 51,2 В."
      panel_kwp:
        name: Мощность панелей, кВтп
        description: Суммарная паспортная мощность солнечных панелей, например 7. Используется для прогноза солнца, пока модель не переобучилась на ваших данных.
      panel_tilt_deg:
        name: Наклон панелей, градусы
        description: 0 = лежат горизонтально, 90 = вертикально. Например 26.
      panel_azimuth_deg:
        name: Азимут панелей, градусы
        description: "Куда смотрят панели: 180 = строго на юг, 90 = восток, 270 = запад. 15° западнее юга = 195. Проверка по часу пика: при 180° пик в солнечный полдень, а он по местным часам часто не в 12:00 (в Стамбуле около 12:50 зимой и 13:05 летом); пик раньше полудня — панели восточнее юга. После изменения модель солнца переобучается на новой ориентации."
      min_soc_pct:
        name: Минимальный SOC, %
        description: Абсолютное дно разряда в процентах (25 = не разряжать ниже 25%). Резерв отключений может держать пол выше — этот параметр лишь жёсткая нижняя граница.
      max_soc_pct:
        name: Максимальный SOC, %
        description: До скольки процентов разрешено заряжать батарею (100 = полностью).
      discharge_efficiency:
        name: КПД разряда
        description: Доля энергии, доходящей до нагрузки при разряде (0.95 = 95%).
      charge_efficiency:
        name: КПД заряда
        description: Доля энергии, доходящая до батареи при заряде (0.95 = 95%).
      max_charge_kw:
        name: Макс. мощность заряда, кВт
        description: "Ограничение инвертора на заряд АКБ. Например 5. Кнопка «Автоматический поиск» предлагает значение из настроек инвертора — ток заряда АКБ из сети × напряжение, не больше номинала инвертора."
      max_discharge_kw:
        name: Макс. мощность разряда, кВт
        description: "Ограничение инвертора на разряд АКБ. Например 5. Кнопка «Автоматический поиск» предлагает значение из настроек инвертора — максимальный ток разряда АКБ × напряжение, не больше номинала инвертора."
      floor_input_entity:
        name: Сущность текущего порога SOC
        description: input_number или number, где хранится нижний порог SOC инвертора в процентах, например input_number.deye_soc_backup или number.inverter_battery_low_soc.
      entity_load_power:
        name: Сущность — мощность нагрузки
        description: "Что: мощность всех потребителей дома. Единицы: ватты. Пример: sensor.inverter_load_power. Основной ряд для прогноза нагрузки. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      entity_critical_load_power:
        name: Сущность — критическая нагрузка
        description: "Что: мощность резервируемых (UPS) потребителей. Единицы: ватты. Пример: sensor.inverter_load_ups_power. По ней считается резерв на случай отключения сети. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      entity_pv_power:
        name: Сущность — мощность солнца
        description: "Что: мощность солнечных панелей. Единицы: ватты. Пример: sensor.inverter_pv_power. Ряд для обучения модели солнечной генерации. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      entity_battery_power:
        name: Сущность — мощность батареи
        description: "Что: мощность заряда/разряда АКБ. Единицы: ватты; знак по конвенции вашей интеграции (у Deye: минус = заряд). Пример: sensor.inverter_battery_power. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      entity_grid_power:
        name: Сущность — мощность сети
        description: "Что: обмен с сетью. Единицы: ватты; плюс = потребление из сети. Пример: sensor.inverter_grid_power. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      entity_battery_soc:
        name: Сущность — заряд батареи
        description: "Что: текущий уровень заряда АКБ. Единицы: проценты (0–100). Пример: sensor.inverter_battery. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      entity_outdoor_temperature:
        name: Сущность — уличная температура
        description: "Что: температура на улице. Единицы: °C. Подойдёт любой уличный датчик. Пример: sensor.home_temperature. Улучшает прогноз нагрузки. Пусто = аддон сам подставляет температуру из Open-Meteo."
      entity_grid_status:
        name: Сущность — статус сети
        description: "Что: наличие сети. Тип: binary_sensor (on = сеть есть, off = отключение). Пример: binary_sensor.inverter_grid. По нему ведётся журнал отключений. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      entity_grid_voltage:
        name: Сущность — напряжение сети
        description: "Необязательно, можно оставить пустым. Что: напряжение любой фазы. Единицы: вольты. Пример: sensor.inverter_grid_l1_voltage. Дополнение к binary_sensor статуса сети — помогает распознать отключение в часах, где у binary_sensor нет истории. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      entity_export_counter:
        name: Сущность — счётчик отдачи в сеть
        description: "Что: суммарная отданная в сеть энергия. Единицы: кВт·ч (нарастающий счётчик). Пример: sensor.inverter_total_energy_export. Если счётчика нет, оставьте поле пустым. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      tou_soc_entity_template:
        name: Шаблон сущностей SOC зон TOU
        description: "Шаблон с {n} вместо номера зоны (1–6). Пример: number.inverter_program_{n}_soc разворачивается в number.inverter_program_1_soc … number.inverter_program_6_soc. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      tou_time_entity_template:
        name: Шаблон сущностей времени зон TOU
        description: "Шаблон с {n} вместо номера зоны (1–6). Пример: time.inverter_program_{n}_time разворачивается в time.inverter_program_1_time … time.inverter_program_6_time. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      run_time:
        name: Время ежедневного расчёта
        description: ЧЧ:ММ по местному времени. Расчёт и уведомление выполняются раз в день в этот момент.
      notifications:
        name: Уведомления
        description: Показывать итог расчёта уведомлением в Home Assistant. Уведомления об ошибках (протухшая погода, сбой расчёта или переобучения, битые сущности) приходят всегда и снимаются сами при восстановлении.
      apply_mode:
        name: Применять план к инвертору
        description: "ВЫКЛ (рекомендуется на первые 1–2 недели): только советы, в инвертор ничего не пишется. ВКЛ: после расчёта аддон записывает целевые SOC в зоны TOU инвертора и порог SOC в input_number. Записываются только изменения от 5 п.п."
      retrain_enabled:
        name: Автоматическое переобучение
        description: Модели прогноза дообучаются на данных объекта с заданным интервалом. Кнопка переобучения в панели работает независимо от этого переключателя.
      retrain_interval_days:
        name: Интервал переобучения, дней
        description: Как часто модели переобучаются автоматически (1–30).
      optimizer_enabled:
        name: MILP-оптимизатор
        description: Суточный оптимальный план заряда/разряда с тарифами и целевыми SOC зон TOU. Если выключен — действует только эвристика пола SOC.
      day_zone_strategy:
        name: Стратегия дневных зон
        description: "flat (по умолчанию): все зоны вне дешёвых часов получают один пол — минимальный SOC, а во время серии отключений — резерв. Инвертор не разряжает АКБ ниже Batt% зоны, поэтому любое значение выше заставило бы брать сеть по дневной цене при заряженной батарее. Зона ночного заряда — цель заряда от оптимизатора. ladder (лестница): пол каждой зоны следует почасовой траектории плана — имеет смысл только при дорогом пике внутри дня."
      tariff_enabled:
        name: Ночной дешёвый тариф
        description: Включите, если электричество дешевле в заданные часы — оптимизатор будет заряжать АКБ из сети в дешёвое окно и разряжать в дорогое.
      tariff_normal_price:
        name: Обычная цена
        description: Цена кВт·ч вне дешёвых окон, в вашей валюте. Можно в относительных единицах — важно соотношение с дешёвой ценой.
      tariff_cheap_price:
        name: Дешёвая цена
        description: Цена кВт·ч внутри дешёвых окон.
      tariff_cheap_windows:
        name: Окна дешёвого тарифа
        description: Местное время, ЧЧ:ММ-ЧЧ:ММ; несколько окон через запятую. Окно может переходить через полночь, например 23:00-07:00, 13:00-15:00.
      reserve_cold_start_hours:
        name: Минимальная автономия, часы
        description: "Постоянный запас в часах работы критической нагрузки, который держится даже без отключений (0–20, по умолчанию 0). Во время серии отключений резерв считается по её реальной длительности; 0 = в спокойный период держать только min SOC и не защищаться от фантомных отключений."
      reserve_pv_aware:
        name: Резерв с учётом солнца
        description: "ВКЛ: в часы, когда пессимистичный прогноз солнца перекрывает критическую нагрузку, резерв отключений на эти часы снижается (ночной резерв не меняется). ВЫКЛ: резерв одинаковый круглые сутки."
      entity_battery_soh:
        name: Сущность — износ батареи (SoH)
        description: "Датчик состояния батареи в процентах, например sensor.inverter_battery_soh, или просто число (99 = 99%). Учитывается при расчёте резерва и энергии в оптимизаторе. Пусто = батарея новая (100%); датчик можно найти кнопкой поиска; none = не учитывать."
      history_backfill_days:
        name: Глубина загрузки истории, дней
        description: "Сколько дней прошлого аддон забирает из истории Home Assistant при первом запуске и по кнопке «Загрузить историю» (0–60, по умолчанию 14). Реальная глубина ограничена сроком хранения рекордера HA (обычно 10 дней). Эти данные сразу идут в обучение моделей прогноза."
      load_holidays:
        name: Праздничные дни
        description: "Ежегодные даты, когда потребление похоже на выходной, через запятую в формате ММ-ДД, например 01-01,01-07,03-08,05-09. Модель нагрузки учтёт их со следующего переобучения. Пусто = без праздников."
      autotune:
        name: Автонастройка по данным
        description: "Применять то, что аддон выучил сам: реальную ёмкость и КПД батареи, ориентацию панелей, профиль критической нагрузки по часам и подобранные на вашей истории настройки плана. Лимиты мощности только повышаются, если данные доказывают, что инвертор может больше. Выключено = выученное показывается в панели как совет."
      priority_mode:
        name: Приоритет
        description: "Насколько осторожно считать план. economy — на солнечный день: ночной заряд рассчитан на солнце P90, резерв под 80% отключений серии; balanced — среднее солнце (P50), резерв под 90%; resilience — на пасмурный день (солнце P10), резерв под 95% и запас 1–2 ч. Нагрузка во всех режимах — медианная (P50). Автонастройка выбирает только среди вариантов, которые разрешает приоритет."
      publish_sensors:
        name: Публиковать сенсоры
        description: "Создавать в Home Assistant сенсоры sensor.emhass_shadow_*: рекомендуемый пол SOC, автономия батареи в часах и время старта каждой переносимой нагрузки — для ваших автоматизаций. Это не запись в инвертор. Выключено = только уведомление."
      deferrable_loads:
        name: Переносимые нагрузки
        description: "Приборы, которые можно включать в любое время в своём окне: бойлер, стиральная машина, насос. Для каждого: name — название, power_kw — мощность, hours — сколько часов в сутки работать, window — допустимое окно ЧЧ:ММ-ЧЧ:ММ (пусто = весь день). Аддон подберёт время, когда они будут работать на солнце, которое иначе ушло бы в усечение."
      tou_zones:
        name: Число зон TOU
        description: "Сколько программ (зон) времени использования у инвертора. У Deye — 6. Шаблоны сущностей ниже подставляют номер зоны вместо {n}. Поиск — только по кнопке «Автоматический поиск». Пустое поле не назначает сущность; none — отключить."
      tou_soc_step_pct:
        name: Шаг SOC зон, %
        description: "С каким шагом инвертор принимает SOC зоны (у Deye — 5). Цели всегда округляются вверх до этого шага, чтобы не срезать резерв."
      tou_grid_charge_entity_template:
        name: Шаблон флага «заряд из сети» зоны
        description: "Сущность switch или input_boolean, которая включает заряд из сети в зоне, с {n} вместо номера, например switch.inverter_program_{n}_charging. Если задано и включено применение плана, аддон разрешает заряд из сети только там, где он нужен для резерва, в дешёвые часы, а без тарифа — в зонах без солнца. Пусто = Program N Charging из ha-solarman, если он есть; none = флаги не трогать."
      outage_memory_days:
        name: Память серии отключений, дней
        description: "Отключения идут сериями. Пока последнее отключение было не больше этого числа дней назад, серия считается идущей: аддон держит резерв по реальной длительности её отключений и поднимает его в часы, когда отключали. Дольше тишины — серия закончилась, резерв не держится (3–60, по умолчанию 14)."
      history_statistics_days:
        name: Глубина долгосрочной статистики, дней
        description: "Сколько дней почасовой статистики Home Assistant подтянуть при первом запуске и по кнопке «Загрузить историю» — сверх подробной истории recorder (0–730, по умолчанию 365). HA хранит её месяцами для сенсоров с state_class; с ней модели сразу учатся на сезонах вашего дома. 0 = не использовать."
      replan_minutes:
        name: Пересчёт плана, минут
        description: "Как часто пересчитывать план между ежедневными расчётами (15–240, по умолчанию 120 — раз в два часа). Частый пересчёт держит цели зон на реальном SOC и свежем прогнозе; в инвертор записываются только изменения не меньше шага SOC, а уведомление приходит только если что-то записано или не удалось записать."
      tou_grid_charge_on_option:
        name: Вариант select «заряд из сети включён»
        description: "Только для select-флагов (например select.inverter_program_{n}_charging). Пусто = аддон сам выберет вариант со словом Grid (или Grid & Gen, если в зоне уже включён генератор). Укажите точное название, если варианты называются иначе."
      tou_grid_charge_off_option:
        name: Вариант select «заряд из сети выключен»
        description: "Только для select-флагов. Пусто = аддон сам выберет Disabled / Off (или Gen, если в зоне включён генератор). Укажите точное название, если варианты называются иначе."
      calibration_charge_enabled:
        name: Калибровочный заряд BMS
        description: "BMS считает SOC через шунт и уточняет его только при полном заряде; без полного заряда ошибка растёт. Если батарея не была заряжена до 100% дольше интервала ниже, аддон в ближайшее ночное окно (дешёвые часы тарифа, без тарифа 00:00–07:00) зарядит её до 100%. Полный заряд от солнца или вашей автоматизации сбрасывает отсчёт. Выключено = аддон никогда не заряжает до 100% сам."
      calibration_interval_days:
        name: Интервал калибровки, дней
        description: "Через сколько дней без полного заряда устраивать калибровочный заряд до 100% (3–60, по умолчанию 14)."
  en:
    configuration:
      open_meteo_model:
        name: Open-Meteo weather model
        description: Auto uses automatic selection; ECMWF uses IFS HRES; ICON and GFS use Seamless. Each selection has separate history and training.
      latitude:
        name: Latitude
        description: Site coordinate, e.g. 44.94892. Used for solar geometry and weather. Use Automatic search or enter the value manually.
      longitude:
        name: Longitude
        description: Site coordinate, e.g. 34.10887. Use Automatic search or enter the value manually.
      time_zone:
        name: Time zone
        description: IANA name, e.g. Europe/Istanbul. All windows and zones use local time. Use Automatic search or enter the value manually.
      capacity_kwh:
        name: Battery capacity, kWh
        description: "Full nominal battery capacity, e.g. 32. Automatic search can suggest it from the inverter settings — Battery Capacity (Ah) × 51.2 V."
      panel_kwp:
        name: Panel capacity, kWp
        description: Total nameplate power of the solar array, e.g. 7. Used for the PV forecast until the model has retrained on your data.
      panel_tilt_deg:
        name: Panel tilt, degrees
        description: 0 = flat, 90 = vertical. E.g. 26.
      panel_azimuth_deg:
        name: Panel azimuth, degrees
        description: "Facing direction: 180 = due south, 90 = east, 270 = west. 15 degrees west of south = 195. Check against the hour of peak output: at 180 it peaks at solar noon, which on local clocks is often not 12:00 (around 12:50 in winter and 13:05 in summer in Istanbul); a peak before solar noon means the panels face east of south. A change retrains the PV model on the new orientation."
      min_soc_pct:
        name: Minimum SOC, %
        description: Absolute discharge floor in percent (25 = never discharge below 25%). The outage reserve may hold the floor higher — this is only the hard lower bound.
      max_soc_pct:
        name: Maximum SOC, %
        description: How far the battery may be charged, in percent (100 = full).
      discharge_efficiency:
        name: Discharge efficiency
        description: Share of battery energy reaching the loads (0.95 = 95%).
      charge_efficiency:
        name: Charge efficiency
        description: Share of input energy stored in the battery (0.95 = 95%).
      max_charge_kw:
        name: Max charge power, kW
        description: "Inverter charge limit for the battery, e.g. 5. Automatic search can suggest it from the inverter settings — battery grid charging current × voltage, capped by the inverter rating."
      max_discharge_kw:
        name: Max discharge power, kW
        description: "Inverter discharge limit for the battery, e.g. 5. Automatic search can suggest it from the inverter settings — battery max discharging current × voltage, capped by the inverter rating."
      floor_input_entity:
        name: Current floor SOC entity
        description: input_number or number holding the inverter's lower SOC threshold in percent, e.g. input_number.deye_soc_backup or number.inverter_battery_low_soc.
      entity_load_power:
        name: Entity — load power
        description: "What: total house consumption power. Units: watts. Example: sensor.inverter_load_power. The main series for the load forecast. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      entity_critical_load_power:
        name: Entity — critical load power
        description: "What: backup/UPS loads power. Units: watts. Example: sensor.inverter_load_ups_power. Drives the outage reserve sizing. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      entity_pv_power:
        name: Entity — PV power
        description: "What: solar array power. Units: watts. Example: sensor.inverter_pv_power. Training series for the solar forecast model. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      entity_battery_power:
        name: Entity — battery power
        description: "What: battery charge/discharge power. Units: watts; sign follows your integration's convention (Deye: negative = charging). Example: sensor.inverter_battery_power. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      entity_grid_power:
        name: Entity — grid power
        description: "What: grid exchange. Units: watts; positive = importing. Example: sensor.inverter_grid_power. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      entity_battery_soc:
        name: Entity — battery SOC
        description: "What: current battery state of charge. Units: percent (0-100). Example: sensor.inverter_battery. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      entity_outdoor_temperature:
        name: Entity — outdoor temperature
        description: "What: outdoor temperature. Units: °C. Any outdoor sensor works. Example: sensor.home_temperature. Improves the load forecast. Empty = the add-on falls back to Open-Meteo temperature."
      entity_grid_status:
        name: Entity — grid status
        description: "What: grid availability. Type: binary_sensor (on = grid up, off = outage). Example: binary_sensor.inverter_grid. Feeds the outage log. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      entity_grid_voltage:
        name: Entity — grid voltage
        description: "Optional, may be left empty. What: any phase voltage. Units: volts. Example: sensor.inverter_grid_l1_voltage. Complements the grid binary_sensor — helps detect outages in hours where the binary sensor has no history. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      entity_export_counter:
        name: Entity — grid export counter
        description: "What: total energy exported to the grid. Units: kWh (cumulative counter). Example: sensor.inverter_total_energy_export. If no counter is available, leave the field empty. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      tou_soc_entity_template:
        name: TOU zone SOC entity template
        description: "Template with {n} for the zone number (1-6). Example: number.inverter_program_{n}_soc expands to number.inverter_program_1_soc … number.inverter_program_6_soc. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      tou_time_entity_template:
        name: TOU zone time entity template
        description: "Template with {n} for the zone number (1-6). Example: time.inverter_program_{n}_time expands to time.inverter_program_1_time … time.inverter_program_6_time. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      run_time:
        name: Daily run time
        description: HH:MM local. The plan and notification are produced once a day at this time.
      notifications:
        name: Notifications
        description: Show the plan summary as a Home Assistant notification. Error alerts (stale weather, failed run or retrain, broken entities) are always sent and clear themselves on recovery.
      apply_mode:
        name: Apply plan to inverter
        description: "OFF (recommended for the first 1-2 weeks): advisory only, nothing is written. ON: after each run the add-on writes target SOCs to the inverter's TOU zones and the floor SOC to the input_number. Only changes of 5 pp or more are written."
      retrain_enabled:
        name: Automatic retraining
        description: Forecast models retrain on site data at the configured interval. The panel retrain button works regardless.
      retrain_interval_days:
        name: Retrain interval, days
        description: How often models retrain automatically (1-30).
      optimizer_enabled:
        name: MILP optimizer
        description: Optimal day-ahead charge/discharge plan with tariffs and per-zone TOU SOC targets. When off, only the SOC floor heuristic runs.
      day_zone_strategy:
        name: Daytime zone strategy
        description: "flat (default): every zone outside the cheap hours gets one floor — min SOC, or the outage reserve while an outage series is live. The inverter never discharges below a zone's Batt%, so any higher value would buy grid energy at the day price while the battery still holds charge. The night charge zone keeps the optimizer's charge target. ladder: each zone's floor follows the plan's hourly trajectory — useful only with an expensive peak inside the day."
      tariff_enabled:
        name: Cheap night tariff
        description: Enable if electricity is cheaper during set hours — the optimizer will charge from the grid in cheap windows and discharge in expensive ones.
      tariff_normal_price:
        name: Normal price
        description: Price per kWh outside cheap windows, in your currency. Relative values are fine — the ratio to the cheap price is what matters.
      tariff_cheap_price:
        name: Cheap price
        description: Price per kWh inside cheap windows.
      tariff_cheap_windows:
        name: Cheap tariff windows
        description: Local time, HH:MM-HH:MM; several windows comma-separated. A window may wrap midnight, e.g. 23:00-07:00, 13:00-15:00.
      reserve_cold_start_hours:
        name: Minimum autonomy, hours
        description: "Standing reserve in hours of critical load, kept even with no outages (0-20, default 0). During an outage series the reserve follows the series' real durations; 0 = in quiet periods keep only min SOC, no protection against phantom outages."
      reserve_pv_aware:
        name: PV-aware reserve
        description: "ON: during hours where the pessimistic solar forecast covers the critical load, the outage reserve for those hours is reduced (the night reserve is unchanged). OFF: the reserve is flat around the clock."
      entity_battery_soh:
        name: Entity — battery SoH
        description: "Battery state-of-health sensor in percent, e.g. sensor.inverter_battery_soh, or a plain number (99 = 99%). Used for reserve sizing and optimizer energy accounting. Empty assumes a new battery (100%); Automatic search can suggest a sensor; none ignores it."
      history_backfill_days:
        name: History backfill depth, days
        description: "How many past days the add-on pulls from Home Assistant history on first run and via the 'Backfill history' button (0-60, default 14). Actual depth is limited by the HA recorder retention (usually 10 days). This data feeds the forecast model training immediately."
      load_holidays:
        name: Holidays
        description: "Recurring dates with weekend-like consumption, comma-separated MM-DD, e.g. 01-01,12-25. The load model uses them from the next retrain. Empty = no holidays."
      autotune:
        name: Autotune from data
        description: "Apply what the add-on learned by itself: real battery capacity and efficiency, panel orientation, hourly critical-load profile and plan settings tuned on your history. Power limits are only raised when the data proves the inverter can do more. Off = learned values are shown in the panel as advice."
      priority_mode:
        name: Priority
        description: "How cautious the plan is. economy: a sunny day, the night charge is sized for sun P90, reserve for 80% of the series' outages; balanced: median sun (P50), reserve for 90%; resilience: a gloomy day (sun P10), reserve for 95% plus 1-2 h. The load scenario is the median (P50) in every mode. Autotune only picks among the options the priority allows."
      publish_sensors:
        name: Publish sensors
        description: "Create sensor.emhass_shadow_* in Home Assistant: recommended SOC floor, battery autonomy in hours and the start time of every flexible load, for your automations. This is not an inverter write. Off = notification only."
      deferrable_loads:
        name: Flexible loads
        description: "Appliances that may run at any time inside their window: water heater, washer, pump. For each: name, power_kw, hours per day, window HH:MM-HH:MM (empty = all day). The add-on picks the time they run on sun that would otherwise be curtailed."
      tou_zones:
        name: TOU zones
        description: "How many time-of-use programs (zones) the inverter has. Deye has 6. The entity templates below substitute the zone number for {n}. Use Automatic search or configure manually. An empty field assigns no entity; none disables it."
      tou_soc_step_pct:
        name: Zone SOC step, %
        description: "The SOC granularity the inverter accepts for a zone (Deye: 5). Targets are always rounded up to this step so the reserve is never shaved."
      tou_grid_charge_entity_template:
        name: Zone grid-charge flag template
        description: "switch or input_boolean entity that enables grid charging in a zone, with {n} for the zone number, e.g. switch.inverter_program_{n}_charging. When set and apply mode is on, the add-on allows grid charging only where the reserve needs it, in cheap hours, or (without a tariff) in zones with no sun. Automatic search can suggest it. Empty or none leaves the flags alone."
      outage_memory_days:
        name: Outage series memory, days
        description: "Outages come in series. While the last outage is at most this many days old the series is live: the add-on holds a reserve sized on its real outage durations and raises it in the hours it hit. Longer quiet means the series is over and no reserve is held (3-60, default 14)."
      history_statistics_days:
        name: Long-term statistics depth, days
        description: "How many days of Home Assistant hourly statistics to pull on first start and via 'Backfill history', beyond the detailed recorder history (0-730, default 365). HA keeps them for months for sensors with a state_class, so the models learn your home's seasons at once. 0 = off."
      replan_minutes:
        name: Replan interval, minutes
        description: "How often to replan between the daily runs (15-240, default 120 — every two hours). Frequent replans keep zone values on the measured SOC and a fresh forecast; only changes of at least one SOC step are written, and a notification is sent only when something was written or failed."
      tou_grid_charge_on_option:
        name: Select option for grid charge on
        description: "Only for select flags (e.g. select.inverter_program_{n}_charging). Empty = the add-on picks the option containing Grid (or Grid & Gen when the zone already charges from a generator). Set the exact name if your options are named differently."
      tou_grid_charge_off_option:
        name: Select option for grid charge off
        description: "Only for select flags. Empty = the add-on picks Disabled / Off (or Gen when the zone charges from a generator). Set the exact name if your options are named differently."
      calibration_charge_enabled:
        name: BMS calibration charge
        description: "A BMS counts SOC through a shunt and only re-anchors it at a full charge; without one the error grows. When the battery has not been at 100% for longer than the interval below, the add-on charges it to 100% in the next night window (cheap tariff hours, 00:00-07:00 without a tariff). A full charge from the sun or your automation resets the count. Off = the add-on never charges to 100% on its own."
      calibration_interval_days:
        name: Calibration interval, days
        description: "Days without a full charge before a calibration charge to 100% (3-60, default 14)."
