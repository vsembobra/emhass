name: "EMHASS Shadow — теневой план батареи"
description: >-
  Теневой режим EMHASS: ежедневный сбор данных из Recorder, квантильные
  прогнозы нагрузки и солнечной генерации, расчёт резерва отключений и
  MILP-оптимизатор (CVXPY/HiGHS) суточного плана батареи: плавающий пол SOC,
  целевые SOC для шести зон TOU, ночная зарядка по дешёвому тарифу. Модели
  периодически переобучаются на накопленных данных объекта, точность
  прогнозов отслеживается в панели. В инвертор ничего не записывает.
version: "0.9.1"
slug: emhass_shadow
init: false
arch:
  - amd64
  - aarch64
startup: application
boot: auto
hassio_api: true
homeassistant_api: true
map:
  - share:rw
ingress: true
ingress_port: 8099
panel_admin: false
panel_icon: mdi:battery-sync-outline
panel_title: Теневой план
options:
  latitude: 44.94892
  longitude: 34.10887
  time_zone: Europe/Istanbul
  capacity_kwh: 32.0
  panel_kwp: 7.0
  panel_tilt_deg: 26.0
  panel_azimuth_deg: 195.0
  min_soc_pct: 10.0
  max_soc_pct: 100.0
  discharge_efficiency: 0.95
  charge_efficiency: 0.95
  max_charge_kw: 5.0
  max_discharge_kw: 5.0
  floor_input_entity: input_number.deye_soc_backup
  entity_load_power: sensor.inverter_load_power
  entity_critical_load_power: sensor.inverter_load_ups_power
  entity_pv_power: sensor.inverter_pv_power
  entity_battery_power: sensor.inverter_battery_power
  entity_grid_power: sensor.inverter_grid_power
  entity_battery_soc: sensor.inverter_battery
  entity_outdoor_temperature: ""
  entity_grid_status: binary_sensor.inverter_grid
  entity_grid_voltage: sensor.inverter_grid_l1_voltage
  entity_export_counter: sensor.inverter_total_energy_export
  tou_soc_entity_template: number.inverter_program_{n}_soc
  tou_time_entity_template: time.inverter_program_{n}_time
  run_time: "06:47"
  notifications: true
  apply_mode: false
  retrain_enabled: true
  retrain_interval_days: 7
  optimizer_enabled: true
  day_zone_strategy: ladder
  tariff_enabled: false
  tariff_normal_price: 2.0
  tariff_cheap_price: 1.0
  tariff_cheap_windows: "23:00-07:00"
  reserve_cold_start_hours: 2.0
  reserve_pv_aware: true
  history_backfill_days: 14
  entity_battery_soh: ""
  load_holidays: ""
  autotune: false
  priority_mode: balanced
  publish_sensors: false
  deferrable_loads: []
schema:
  latitude: float(-90,90)
  longitude: float(-180,180)
  time_zone: str
  capacity_kwh: float(1,200)
  panel_kwp: float(0.5,100)
  panel_tilt_deg: float(0,90)
  panel_azimuth_deg: float(0,360)
  min_soc_pct: float(0,50)
  max_soc_pct: float(50,100)
  discharge_efficiency: float(0.5,1)
  charge_efficiency: float(0.5,1)
  max_charge_kw: float(0.5,50)
  max_discharge_kw: float(0.5,50)
  floor_input_entity: str
  entity_load_power: str
  entity_critical_load_power: str
  entity_pv_power: str
  entity_battery_power: str
  entity_grid_power: str
  entity_battery_soc: str
  entity_outdoor_temperature: str?
  entity_grid_status: str
  entity_grid_voltage: str?
  entity_export_counter: str
  tou_soc_entity_template: str
  tou_time_entity_template: str
  run_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  notifications: bool
  apply_mode: bool
  retrain_enabled: bool
  retrain_interval_days: int(1,30)
  optimizer_enabled: bool
  day_zone_strategy: list(ladder|flat)
  tariff_enabled: bool
  tariff_normal_price: float(0,1000)
  tariff_cheap_price: float(0,1000)
  tariff_cheap_windows: str
  reserve_cold_start_hours: float(1,20)
  reserve_pv_aware: bool
  history_backfill_days: int(0,60)
  entity_battery_soh: str?
  load_holidays: str?
  autotune: bool
  priority_mode: list(resilience|balanced|economy)
  publish_sensors: bool
  deferrable_loads:
    - name: str
      power_kw: float(0.1,30)
      hours: float(0.5,12)
      window: str?
translations:
  ru:
    configuration:
      latitude:
        name: Широта
        description: Координата объекта, например 44.94892. Нужна для расчёта высоты солнца и погоды.
      longitude:
        name: Долгота
        description: Координата объекта, например 34.10887.
      time_zone:
        name: Часовой пояс
        description: Имя из базы IANA, например Europe/Istanbul. Все окна и зоны считаются по местному времени.
      capacity_kwh:
        name: Ёмкость батареи, кВт·ч
        description: Полная номинальная ёмкость АКБ. Например 32 для 32 кВт·ч.
      panel_kwp:
        name: Мощность панелей, кВтп
        description: Суммарная паспортная мощность солнечных панелей, например 7. Используется для прогноза солнца, пока модель не переобучилась на ваших данных.
      panel_tilt_deg:
        name: Наклон панелей, градусы
        description: 0 = лежат горизонтально, 90 = вертикально. Например 26.
      panel_azimuth_deg:
        name: Азимут панелей, градусы
        description: "Куда смотрят панели: 180 = строго на юг, 90 = восток, 270 = запад. 15° западнее юга = 195."
      min_soc_pct:
        name: Минимальный SOC, %
        description: Абсолютное дно разряда в процентах (25 = не разряжать ниже 25%). Резерв отключений может держать пол выше — этот параметр лишь жёсткая нижняя граница.
      max_soc_pct:
        name: Максимальный SOC, %
        description: До скольки процентов разрешено заряжать батарею (100 = полностью).
      discharge_efficiency:
        name: КПД разряда
        description: Доля энергии, доходящей до нагрузки при разряде (0.95 = 95%).
      charge_efficiency:
        name: КПД заряда
        description: Доля энергии, доходящая до батареи при заряде (0.95 = 95%).
      max_charge_kw:
        name: Макс. мощность заряда, кВт
        description: Ограничение инвертора на заряд АКБ. Например 5.
      max_discharge_kw:
        name: Макс. мощность разряда, кВт
        description: Ограничение инвертора на разряд АКБ. Например 5.
      floor_input_entity:
        name: Сущность текущего порога SOC
        description: input_number или number, где хранится нижний порог SOC инвертора в процентах, например input_number.deye_soc_backup или number.inverter_battery_low_soc.
      entity_load_power:
        name: Сущность — мощность нагрузки
        description: "Что: мощность всех потребителей дома. Единицы: ватты. Пример: sensor.inverter_load_power. Основной ряд для прогноза нагрузки."
      entity_critical_load_power:
        name: Сущность — критическая нагрузка
        description: "Что: мощность резервируемых (UPS) потребителей. Единицы: ватты. Пример: sensor.inverter_load_ups_power. По ней считается резерв на случай отключения сети."
      entity_pv_power:
        name: Сущность — мощность солнца
        description: "Что: мощность солнечных панелей. Единицы: ватты. Пример: sensor.inverter_pv_power. Ряд для обучения модели солнечной генерации."
      entity_battery_power:
        name: Сущность — мощность батареи
        description: "Что: мощность заряда/разряда АКБ. Единицы: ватты; знак по конвенции вашей интеграции (у Deye: минус = заряд). Пример: sensor.inverter_battery_power."
      entity_grid_power:
        name: Сущность — мощность сети
        description: "Что: обмен с сетью. Единицы: ватты; плюс = потребление из сети. Пример: sensor.inverter_grid_power."
      entity_battery_soc:
        name: Сущность — заряд батареи
        description: "Что: текущий уровень заряда АКБ. Единицы: проценты (0–100). Пример: sensor.inverter_battery."
      entity_outdoor_temperature:
        name: Сущность — уличная температура
        description: "Что: температура на улице. Единицы: °C. Подойдёт любой уличный датчик. Пример: sensor.home_temperature. Улучшает прогноз нагрузки. Пусто = аддон сам подставляет температуру из Open-Meteo."
      entity_grid_status:
        name: Сущность — статус сети
        description: "Что: наличие сети. Тип: binary_sensor (on = сеть есть, off = отключение). Пример: binary_sensor.inverter_grid. По нему ведётся журнал отключений."
      entity_grid_voltage:
        name: Сущность — напряжение сети
        description: "Необязательно, можно оставить пустым. Что: напряжение любой фазы. Единицы: вольты. Пример: sensor.inverter_grid_l1_voltage. Дополнение к binary_sensor статуса сети — помогает распознать отключение в часах, где у binary_sensor нет истории."
      entity_export_counter:
        name: Сущность — счётчик отдачи в сеть
        description: "Что: суммарная отданная в сеть энергия. Единицы: кВт·ч (нарастающий счётчик). Пример: sensor.inverter_total_energy_export. Нет продажи в сеть — оставьте как есть, покажет ноль."
      tou_soc_entity_template:
        name: Шаблон сущностей SOC зон TOU
        description: "Шаблон с {n} вместо номера зоны (1–6). Пример: number.inverter_program_{n}_soc разворачивается в number.inverter_program_1_soc … number.inverter_program_6_soc."
      tou_time_entity_template:
        name: Шаблон сущностей времени зон TOU
        description: "Шаблон с {n} вместо номера зоны (1–6). Пример: time.inverter_program_{n}_time разворачивается в time.inverter_program_1_time … time.inverter_program_6_time."
      run_time:
        name: Время ежедневного расчёта
        description: ЧЧ:ММ по местному времени. Расчёт и уведомление выполняются раз в день в этот момент.
      notifications:
        name: Уведомления
        description: Показывать итог расчёта уведомлением в Home Assistant.
      apply_mode:
        name: Применять план к инвертору
        description: "ВЫКЛ (рекомендуется на первые 1–2 недели): только советы, в инвертор ничего не пишется. ВКЛ: после расчёта аддон записывает целевые SOC в зоны TOU инвертора и порог SOC в input_number. Записываются только изменения от 5 п.п."
      retrain_enabled:
        name: Автоматическое переобучение
        description: Модели прогноза дообучаются на данных объекта с заданным интервалом. Кнопка переобучения в панели работает независимо от этого переключателя.
      retrain_interval_days:
        name: Интервал переобучения, дней
        description: Как часто модели переобучаются автоматически (1–30).
      optimizer_enabled:
        name: MILP-оптимизатор
        description: Суточный оптимальный план заряда/разряда с тарифами и целевыми SOC зон TOU. Если выключен — действует только эвристика пола SOC.
      day_zone_strategy:
        name: Стратегия дневных зон
        description: "ladder (лестница): пол каждой зоны следует оптимальной траектории — бережёт энергию для вечернего пика и на случай отключения. flat (плоский пол): одно минимальное значение на весь дорогой период, включая дневные зарядные окна — инвертор не будет заряжать АКБ из сети в пик, даже если солнца окажется меньше прогноза. На зону ночного заряда (окна дешёвого тарифа) не влияет."
      tariff_enabled:
        name: Ночной дешёвый тариф
        description: Включите, если электричество дешевле в заданные часы — оптимизатор будет заряжать АКБ из сети в дешёвое окно и разряжать в дорогое.
      tariff_normal_price:
        name: Обычная цена
        description: Цена кВт·ч вне дешёвых окон, в вашей валюте. Можно в относительных единицах — важно соотношение с дешёвой ценой.
      tariff_cheap_price:
        name: Дешёвая цена
        description: Цена кВт·ч внутри дешёвых окон.
      tariff_cheap_windows:
        name: Окна дешёвого тарифа
        description: Местное время, ЧЧ:ММ-ЧЧ:ММ; несколько окон через запятую. Окно может переходить через полночь, например 23:00-07:00, 13:00-15:00.
      reserve_cold_start_hours:
        name: Минимальная автономия, часы
        description: "Базовый резерв отключений в часах работы критической нагрузки (1–20, по умолчанию 2). Это нижняя полка: она действует всегда, даже когда отключений давно не было. Чем больше значение, тем выше минимальный SOC, который аддон не позволит проедать."
      reserve_pv_aware:
        name: Резерв с учётом солнца
        description: "ВКЛ: в часы, когда пессимистичный прогноз солнца перекрывает критическую нагрузку, резерв отключений на эти часы снижается (ночной резерв не меняется). ВЫКЛ: резерв одинаковый круглые сутки."
      entity_battery_soh:
        name: Сущность — износ батареи (SoH)
        description: "Датчик состояния батареи в процентах, например sensor.inverter_battery_soh, или просто число (99 = 99%). Учитывается при расчёте резерва и энергии в оптимизаторе. Пусто = считать батарею новой (100%)."
      history_backfill_days:
        name: Глубина загрузки истории, дней
        description: "Сколько дней прошлого аддон забирает из истории Home Assistant при первом запуске и по кнопке «Загрузить историю» (0–60, по умолчанию 14). Реальная глубина ограничена сроком хранения рекордера HA (обычно 10 дней). Эти данные сразу идут в обучение моделей прогноза."
      load_holidays:
        name: Праздничные дни
        description: "Ежегодные даты, когда потребление похоже на выходной, через запятую в формате ММ-ДД, например 01-01,01-07,03-08,05-09. Модель нагрузки учтёт их со следующего переобучения. Пусто = без праздников."
      autotune:
        name: Автонастройка по данным
        description: "Применять то, что аддон выучил сам: реальную ёмкость и КПД батареи, ориентацию панелей, профиль критической нагрузки по часам и подобранные на вашей истории настройки плана. Лимиты мощности только повышаются, если данные доказывают, что инвертор может больше. Выключено = выученное показывается в панели как совет."
      priority_mode:
        name: Приоритет
        description: "Насколько важна защита от отключений по сравнению с экономией. resilience — максимум надёжности (резерв под 95% отключений, запас до утра по пессимистичному прогнозу); balanced — как раньше (90%); economy — больше солнца и экономии (80%, запас до утра может считаться по ожидаемому прогнозу). Автонастройка выбирает только среди вариантов, которые разрешает приоритет."
      publish_sensors:
        name: Публиковать сенсоры
        description: "Создавать в Home Assistant сенсоры sensor.emhass_shadow_*: рекомендуемый пол SOC, автономия батареи в часах и время старта каждой переносимой нагрузки — для ваших автоматизаций. Это не запись в инвертор. Выключено = только уведомление."
      deferrable_loads:
        name: Переносимые нагрузки
        description: "Приборы, которые можно включать в любое время в своём окне: бойлер, стиральная машина, насос. Для каждого: name — название, power_kw — мощность, hours — сколько часов в сутки работать, window — допустимое окно ЧЧ:ММ-ЧЧ:ММ (пусто = весь день). Аддон подберёт время, когда они будут работать на солнце, которое иначе ушло бы в усечение."
  en:
    configuration:
      latitude:
        name: Latitude
        description: Site coordinate, e.g. 44.94892. Used for solar geometry and weather.
      longitude:
        name: Longitude
        description: Site coordinate, e.g. 34.10887.
      time_zone:
        name: Time zone
        description: IANA name, e.g. Europe/Istanbul. All windows and zones use local time.
      capacity_kwh:
        name: Battery capacity, kWh
        description: Full nominal battery capacity, e.g. 32.
      panel_kwp:
        name: Panel capacity, kWp
        description: Total nameplate power of the solar array, e.g. 7. Used for the PV forecast until the model has retrained on your data.
      panel_tilt_deg:
        name: Panel tilt, degrees
        description: 0 = flat, 90 = vertical. E.g. 26.
      panel_azimuth_deg:
        name: Panel azimuth, degrees
        description: "Facing direction: 180 = due south, 90 = east, 270 = west. 15 degrees west of south = 195."
      min_soc_pct:
        name: Minimum SOC, %
        description: Absolute discharge floor in percent (25 = never discharge below 25%). The outage reserve may hold the floor higher — this is only the hard lower bound.
      max_soc_pct:
        name: Maximum SOC, %
        description: How far the battery may be charged, in percent (100 = full).
      discharge_efficiency:
        name: Discharge efficiency
        description: Share of battery energy reaching the loads (0.95 = 95%).
      charge_efficiency:
        name: Charge efficiency
        description: Share of input energy stored in the battery (0.95 = 95%).
      max_charge_kw:
        name: Max charge power, kW
        description: Inverter charge limit for the battery, e.g. 5.
      max_discharge_kw:
        name: Max discharge power, kW
        description: Inverter discharge limit for the battery, e.g. 5.
      floor_input_entity:
        name: Current floor SOC entity
        description: input_number or number holding the inverter's lower SOC threshold in percent, e.g. input_number.deye_soc_backup or number.inverter_battery_low_soc.
      entity_load_power:
        name: Entity — load power
        description: "What: total house consumption power. Units: watts. Example: sensor.inverter_load_power. The main series for the load forecast."
      entity_critical_load_power:
        name: Entity — critical load power
        description: "What: backup/UPS loads power. Units: watts. Example: sensor.inverter_load_ups_power. Drives the outage reserve sizing."
      entity_pv_power:
        name: Entity — PV power
        description: "What: solar array power. Units: watts. Example: sensor.inverter_pv_power. Training series for the solar forecast model."
      entity_battery_power:
        name: Entity — battery power
        description: "What: battery charge/discharge power. Units: watts; sign follows your integration's convention (Deye: negative = charging). Example: sensor.inverter_battery_power."
      entity_grid_power:
        name: Entity — grid power
        description: "What: grid exchange. Units: watts; positive = importing. Example: sensor.inverter_grid_power."
      entity_battery_soc:
        name: Entity — battery SOC
        description: "What: current battery state of charge. Units: percent (0-100). Example: sensor.inverter_battery."
      entity_outdoor_temperature:
        name: Entity — outdoor temperature
        description: "What: outdoor temperature. Units: °C. Any outdoor sensor works. Example: sensor.home_temperature. Improves the load forecast. Empty = the add-on falls back to Open-Meteo temperature."
      entity_grid_status:
        name: Entity — grid status
        description: "What: grid availability. Type: binary_sensor (on = grid up, off = outage). Example: binary_sensor.inverter_grid. Feeds the outage log."
      entity_grid_voltage:
        name: Entity — grid voltage
        description: "Optional, may be left empty. What: any phase voltage. Units: volts. Example: sensor.inverter_grid_l1_voltage. Complements the grid binary_sensor — helps detect outages in hours where the binary sensor has no history."
      entity_export_counter:
        name: Entity — grid export counter
        description: "What: total energy exported to the grid. Units: kWh (cumulative counter). Example: sensor.inverter_total_energy_export. No feed-in? Keep the default, it will read zero."
      tou_soc_entity_template:
        name: TOU zone SOC entity template
        description: "Template with {n} for the zone number (1-6). Example: number.inverter_program_{n}_soc expands to number.inverter_program_1_soc … number.inverter_program_6_soc."
      tou_time_entity_template:
        name: TOU zone time entity template
        description: "Template with {n} for the zone number (1-6). Example: time.inverter_program_{n}_time expands to time.inverter_program_1_time … time.inverter_program_6_time."
      run_time:
        name: Daily run time
        description: HH:MM local. The plan and notification are produced once a day at this time.
      notifications:
        name: Notifications
        description: Show the plan summary as a Home Assistant notification.
      apply_mode:
        name: Apply plan to inverter
        description: "OFF (recommended for the first 1-2 weeks): advisory only, nothing is written. ON: after each run the add-on writes target SOCs to the inverter's TOU zones and the floor SOC to the input_number. Only changes of 5 pp or more are written."
      retrain_enabled:
        name: Automatic retraining
        description: Forecast models retrain on site data at the configured interval. The panel retrain button works regardless.
      retrain_interval_days:
        name: Retrain interval, days
        description: How often models retrain automatically (1-30).
      optimizer_enabled:
        name: MILP optimizer
        description: Optimal day-ahead charge/discharge plan with tariffs and per-zone TOU SOC targets. When off, only the SOC floor heuristic runs.
      day_zone_strategy:
        name: Daytime zone strategy
        description: "ladder: each zone's floor follows the optimal trajectory — saves energy for the evening peak and outage reserve. flat: one minimum value across the whole expensive period, including daytime charging windows — the inverter will not grid-charge the battery at peak prices even if PV falls short of the plan. Does not affect the night charge zone (cheap tariff windows)."
      tariff_enabled:
        name: Cheap night tariff
        description: Enable if electricity is cheaper during set hours — the optimizer will charge from the grid in cheap windows and discharge in expensive ones.
      tariff_normal_price:
        name: Normal price
        description: Price per kWh outside cheap windows, in your currency. Relative values are fine — the ratio to the cheap price is what matters.
      tariff_cheap_price:
        name: Cheap price
        description: Price per kWh inside cheap windows.
      tariff_cheap_windows:
        name: Cheap tariff windows
        description: Local time, HH:MM-HH:MM; several windows comma-separated. A window may wrap midnight, e.g. 23:00-07:00, 13:00-15:00.
      reserve_cold_start_hours:
        name: Minimum autonomy, hours
        description: "Baseline outage reserve in hours of critical load (1-20, default 2). This is the bottom shelf: it applies always, even after long quiet periods. Higher values raise the minimum SOC the add-on will not let the battery drain below."
      reserve_pv_aware:
        name: PV-aware reserve
        description: "ON: during hours where the pessimistic solar forecast covers the critical load, the outage reserve for those hours is reduced (the night reserve is unchanged). OFF: the reserve is flat around the clock."
      entity_battery_soh:
        name: Entity — battery SoH
        description: "Battery state-of-health sensor in percent, e.g. sensor.inverter_battery_soh, or a plain number (99 = 99%). Used for reserve sizing and optimizer energy accounting. Empty = assume a new battery (100%)."
      history_backfill_days:
        name: History backfill depth, days
        description: "How many past days the add-on pulls from Home Assistant history on first run and via the 'Backfill history' button (0-60, default 14). Actual depth is limited by the HA recorder retention (usually 10 days). This data feeds the forecast model training immediately."
      load_holidays:
        name: Holidays
        description: "Recurring dates with weekend-like consumption, comma-separated MM-DD, e.g. 01-01,12-25. The load model uses them from the next retrain. Empty = no holidays."
      autotune:
        name: Autotune from data
        description: "Apply what the add-on learned by itself: real battery capacity and efficiency, panel orientation, hourly critical-load profile and plan settings tuned on your history. Power limits are only raised when the data proves the inverter can do more. Off = learned values are shown in the panel as advice."
      priority_mode:
        name: Priority
        description: "How outage protection weighs against savings. resilience: maximum safety (reserve for 95% of outages, overnight deficit on the pessimistic forecast); balanced: previous behaviour (90%); economy: more sun and savings (80%, the overnight deficit may use the expected forecast). Autotune only picks among the options the priority allows."
      publish_sensors:
        name: Publish sensors
        description: "Create sensor.emhass_shadow_* in Home Assistant: recommended SOC floor, battery autonomy in hours and the start time of every flexible load, for your automations. This is not an inverter write. Off = notification only."
      deferrable_loads:
        name: Flexible loads
        description: "Appliances that may run at any time inside their window: water heater, washer, pump. For each: name, power_kw, hours per day, window HH:MM-HH:MM (empty = all day). The add-on picks the time they run on sun that would otherwise be curtailed."
